<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="banner.css">
<style>
.b{width:1280px;height:640px}
.in{padding:0 72px}
.left{width:640px;flex:none}
.lock{font-size:30px;margin-bottom:46px}
h1{font-size:60px;margin-bottom:26px}
.sub{font-size:21px;margin-bottom:58px}
.url{font-size:18px}
.right{flex:1;display:flex;justify-content:flex-end}
.ui{width:560px;height:360px;font-size:11px;transform:translateY(0)}
.ui .sb{width:140px}
</style></head><body>
<div class="b"><div class="in">
  <div class="left">
    <div class="lock"><svg viewBox="0 0 64 64"><use href="#mark"/></svg>Docksy</div>
    <h1>Deploy to your<br>own server.<br><span class="m">Monitoring on<br>by default.</span></h1>
    <p class="sub">Free forever · Open source · Works with Claude Code</p>
    <p class="url">github.com/<span class="k">osmanyousaaf/docksy</span></p>
  </div>
  <div class="right">
    <div class="ui">
      <div class="sb">
        <div class="brand"><svg viewBox="0 0 64 64"><use href="#mark"/></svg>Docksy</div>
        <i class="a"></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="main">
        <div class="t"></div>
        <div class="tiles">
          <div class="tile"><small>Servers</small><b>3</b><div class="bar" style="--w:100%"></div></div>
          <div class="tile"><small>Apps</small><b>12</b><div class="bar" style="--w:80%"></div></div>
          <div class="tile"><small>CPU</small><b>14%</b><div class="bar" style="--w:14%"></div></div>
          <div class="tile"><small>Alerts</small><b class="ok">0</b><div class="bar" style="--w:0%"></div></div>
        </div>
        <div class="rows">
          <div class="row"><span>App</span><span>Status</span><span>Last deploy</span></div>
          <div class="row"><span>api</span><span class="st">Running</span><span>2 min ago</span></div>
          <div class="row"><span>web</span><span class="st">Running</span><span>1 h ago</span></div>
          <div class="row"><span>postgres</span><span class="st">Running</span><span>3 d ago</span></div>
        </div>
      </div>
    </div>
  </div>
</div></div>
<svg style="display:none"><symbol id="mark" viewBox="0 0 64 64">
  <path fill-rule="evenodd" d="M12 10h22c12.15 0 22 9.85 22 22s-9.85 22-22 22H12V10zm9 9v26h13c7.18 0 13-5.82 13-13s-5.82-13-13-13H21z"/>
  <rect x="21" y="26.5" width="26" height="3"/><rect x="21" y="34.5" width="26" height="3"/>
</symbol></svg>
</body></html>
