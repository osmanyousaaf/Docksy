name: Feature request
description: Suggest an idea or improvement for Docksy.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where Docksy gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you've tried
  - type: checkboxes
    id: principles
    attributes:
      label: Docksy principles
      options:
        - label: This keeps Docksy free for everyone (no paid tiers, no telemetry).
          required: true
