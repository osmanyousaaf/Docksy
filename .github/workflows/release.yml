name: Release

# Push a tag like v0.2.0 to:
#   - build and push the multi-arch image to ghcr.io/osmanyousaaf/docksy
#   - attach the agent binaries (+ checksums) to the GitHub Release
#   - publish @crovenai/docksy-client, @crovenai/docksy and @crovenai/docksy-mcp with provenance
#   - deploy docs/ to GitHub Pages
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/osmanyousaaf/docksy
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          tag="${TAG}"
          version="${tag#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Tag $tag is not semver"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  agent:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Test
        working-directory: agent
        run: go test ./...
      - name: Build
        working-directory: agent
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          mkdir -p ../dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o ../dist/docksy-agent-linux-$arch ./cmd/docksy-agent
          done
          cd ../dist && sha256sum docksy-agent-linux-* > SHA256SUMS && cat SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: agent
          path: dist/*
          if-no-files-found: error

  image:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: VERSION=${{ needs.meta.outputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  github-release:
    needs: [meta, agent, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/*
          body: |
            ## Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/osmanyousaaf/docksy/main/install.sh | sudo bash -s -- --version ${{ needs.meta.outputs.version }}
            ```

            Image: `${{ env.IMAGE }}:${{ needs.meta.outputs.version }}` (linux/amd64, linux/arm64)

  npm:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Set versions from the tag
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          for ws in @crovenai/docksy-client @crovenai/docksy @crovenai/docksy-mcp; do
            npm version "$VERSION" -w "$ws" --no-git-tag-version --allow-same-version
          done
      - name: Build
        run: |
          npm run build -w @crovenai/docksy-client
          npm run build -w @crovenai/docksy
          npm run build -w @crovenai/docksy-mcp
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.meta.outputs.version }}
          DIST_TAG: ${{ needs.meta.outputs.prerelease == 'true' && 'next' || 'latest' }}
        run: |
          for ws in @crovenai/docksy-client @crovenai/docksy @crovenai/docksy-mcp; do
            if npm view "$ws@$VERSION" version >/dev/null 2>&1; then
              echo "$ws@$VERSION is already published; skipping"
              continue
            fi
            npm publish -w "$ws" --provenance --access public --tag "$DIST_TAG"
          done

  pages:
    needs: [meta, github-release]
    if: ${{ needs.meta.outputs.prerelease == 'false' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
