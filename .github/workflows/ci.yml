name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Typecheck, test, build (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build client (the CLI and MCP typecheck against its dist/ types)
        run: npm run build -w @crovenai/docksy-client
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
        env:
          DOCKSY_DISABLE_JOBS: "1"
      - name: Build web UI
        run: npm run build -w @docksy/web
      - name: Build client, CLI and MCP server
        run: |
          npm run build -w @crovenai/docksy-client
          npm run build -w @crovenai/docksy
          npm run build -w @crovenai/docksy-mcp
      - name: Smoke-test the server
        env:
          PORT: "8199"
          DOCKSY_DATA_DIR: ${{ runner.temp }}/docksy-data
        run: |
          node apps/server/src/index.ts > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8199/api/v1/health && exit 0; sleep 1; done
          cat server.log; exit 1

  agent:
    name: Go agent
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o bin/docksy-agent-linux-$arch ./cmd/docksy-agent
          done
          ls -la bin

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: bash -n
        run: for f in install.sh deploy/scripts/*.sh scripts/*.sh e2e/*.sh e2e/fake-vps/*.sh; do [ -f "$f" ] && bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -x install.sh deploy/scripts/*.sh scripts/*.sh e2e/*.sh e2e/fake-vps/*.sh

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: docksy:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run and check health
        run: |
          docker run -d --name docksy -p 8080:8080 --read-only --tmpfs /tmp --cap-drop ALL docksy:ci
          for _ in $(seq 1 60); do
            status="$(docker inspect -f '{{.State.Health.Status}}' docksy)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs docksy
          curl -fsS http://127.0.0.1:8080/api/v1/health
          [ "$(docker inspect -f '{{.State.Health.Status}}' docksy)" = healthy ]
          docker exec docksy sh -c 'id -u; ls deploy/scripts agent/bin apps/web/dist'
